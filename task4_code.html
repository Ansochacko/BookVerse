<!-- 6. Application Structure in HTML -->

<table border="1">
  <thead>
    <tr><th>Title</th><th>Author</th><th>Year</th><th>Genre</th></tr>
  </thead>
  <tbody id="bookTableBody"></tbody>
</table>

<h3>Update Book</h3>
<input id="updateTitle" placeholder="Title" />
<input id="updateAuthor" placeholder="Author" />
<input id="updateYear" placeholder="Year" />
<input id="updateGenre" placeholder="Genre" />
<button onclick="updateBook()">Update</button>

<h3>Remove Book</h3>
<input id="removeTitle" placeholder="Title to Remove" />
<button onclick="removeBook()">Remove</button>
